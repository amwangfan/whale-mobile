name: temporary-mobile-pr-verification
on:
  push:
    branches: [chore/mobile-maintenance-20261108]
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: python3 tests/contract_validate.py
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter test
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter build apk --debug --flavor daily
        working-directory: app
      - run: flutter build apk --debug --flavor root
        working-directory: app
      - run: ./gradlew :app:testDailyDebugUnitTest :app:testRootDebugUnitTest
        working-directory: app/android
      - run: python3 -m unittest discover -s tests -p 'test_voip_media_security.py' -v
