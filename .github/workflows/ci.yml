name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate contract schemas and golden examples
        run: python3 tests/contract_validate.py

  app:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug
      - name: Dart tests
        working-directory: app
        run: flutter test
      - name: Kotlin unit tests (JUnit + Robolectric)
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action 需要许可证密钥；改用官方 CLI（无需密钥，规则相同）
      - name: Secret scan (gitleaks CLI)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --exit-code 1 .
