name: ci

# 与 whale-core 一致：仅由 Actions → Run workflow 手动触发。
# 不在每次 push / PR 更新时自动构建 Android APK、跑测试或扫描历史。
on:
  workflow_dispatch:
    inputs:
      checks:
        description: "运行哪些检查？"
        type: choice
        required: true
        default: contracts
        options:
          - contracts
          - app
          - secret-scan
          - all

concurrency:
  group: whale-mobile-ci-${{ github.ref }}-${{ inputs.checks }}
  cancel-in-progress: true

jobs:
  contracts:
    if: ${{ inputs.checks == 'all' || inputs.checks == 'app' || inputs.checks == 'contracts' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate contract schemas and golden examples
        run: python3 tests/contract_validate.py

  app:
    if: ${{ inputs.checks == 'all' || inputs.checks == 'app' }}
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug
      - name: Dart tests
        working-directory: app
        run: flutter test
      - name: Kotlin unit tests (JUnit + Robolectric)
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest

  secret-scan:
    if: ${{ inputs.checks == 'all' || inputs.checks == 'secret-scan' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action 需要许可证密钥；改用官方 CLI（无需密钥，规则相同）
      - name: Secret scan (gitleaks CLI)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --exit-code 1 .
