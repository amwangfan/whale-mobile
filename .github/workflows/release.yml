# 发布可直接安装的 APK：推送 v* 标签（如 v1.0.0）或在 Actions 手动运行。
# 产物附在 GitHub Release 上，用户在手机上下载安装即可。
# 正式签名：在仓库 Secrets 配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD；未配置时使用 debug 签名（可安装，但升级时需与同一签名一致）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布的版本标签（如 v1.0.0）"
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Signing key (optional)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > app/android/app/release.jks
            printf 'storeFile=app/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/android/key.properties
            echo "using release signing"
          else
            echo "::warning::no signing secrets configured; APKs are debug-signed"
          fi
      - name: Build release APKs
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --flavor daily
          flutter build apk --release --flavor root
      - name: Collect
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/app-daily-release.apk "out/whale-${TAG}-daily.apk"
          cp app/build/app/outputs/flutter-apk/app-root-release.apk "out/whale-${TAG}-root.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: 鲸鱼 Whale 手机端 ${{ env.TAG }}
          files: out/*
          body: |
            **普通手机请下载 `daily` 版**；专门给鲸鱼使用的 Root 手机下载 `root` 版。
            安装后打开 App → 设置 → 连接 Core，填写电脑上 Whale 控制台「设备 → 配对新设备」里显示的地址和 6 位配对码。
