name: temporary-accessibility-verification
on:
  push:
    branches: [feat/accessibility-device-control-20261108]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: ./gradlew :app:testDailyDebugUnitTest :app:testRootDebugUnitTest
        working-directory: app/android
      - run: flutter build apk --debug --flavor daily
        working-directory: app
      - run: flutter build apk --debug --flavor root
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
